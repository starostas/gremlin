[package]
name = "orbit-forge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[workspace]
[features]
default = []
cuda = ["gremlin-cuda/cuda"]
[dependencies]
gremlin-core = { path = "../../../crates/gremlin-core" }
gremlin-cuda = { path = "../../../crates/gremlin-cuda" }
gremlin-codegen = { path = "../../../crates/gremlin-codegen" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
