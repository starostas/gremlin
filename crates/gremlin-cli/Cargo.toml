[package]
name = "gremlin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "gremlin"
path = "src/main.rs"
[dependencies]
gremlin-core = { path = "../gremlin-core" }
gremlin-search = { path = "../gremlin-search" }
