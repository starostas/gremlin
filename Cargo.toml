[workspace]
members = ["crates/gremlin-core", "crates/gremlin-search", "crates/gremlin-cli"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.8.23"
sha2 = "=0.10.9"
