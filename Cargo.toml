[workspace]
members = ["crates/gremlin-core", "crates/gremlin-search", "crates/gremlin-cli", "crates/gremlin-native", "crates/gremlin-cuda", "crates/gremlin-verify", "crates/gremlin-codegen"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
toml = "=0.8.23"
sha2 = "=0.10.9"

# Isolation tests fingerprint worker/runtime bytes on every observation.
# Keep integrity hashing practical in debug builds as the CLI grows.
[profile.dev.package.sha2]
opt-level = 3
